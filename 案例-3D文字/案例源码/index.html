<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>案例-3D文字 | Three.js 文字渲染</title>
    <style>
        body {
            overflow: hidden;
            margin: 0px;
            background: #0a0b10;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 顶部使用提示 */
        #tip {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
        }

        /* 左下角说明面板 */
        #hud {
            position: absolute;
            left: 16px;
            bottom: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #b8e6ff;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
        }

        #hud b {
            color: #fff;
            font-weight: 500;
        }

        /* 字体加载失败的提示 */
        #fontError {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(180, 40, 40, 0.8);
            color: #fff;
            font-size: 13px;
            display: none;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="tip">鼠标拖动 → 环绕观察 ｜ 滚轮 → 缩放 ｜ 右侧面板 → 调整3D文字</div>
    <div id="hud"></div>
    <div id="fontError"></div>

    <!-- type="importmap"功能：.html文件中也能和nodejs开发环境中一样方式，引入npm安装的js库 -->
    <script type="importmap">
        {
			"imports": {
				"three": "../../three.js/build/three.module.js",
                "three/addons/": "../../three.js/examples/jsm/"
			}
		}
	</script>
    <script src="./index.js" type="module">
    </script>
</body>

</html>
