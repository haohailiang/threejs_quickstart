<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>案例-GSAP小球滚动 | timeline.yoyo + 平行光跟随小球</title>
    <style>
        body {
            overflow: hidden;
            margin: 0px;
            background: #0b0d12;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 顶部使用提示 */
        #tip {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
            white-space: nowrap;
        }

        /* 左下角说明面板 */
        #hud {
            position: absolute;
            left: 16px;
            bottom: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: #b8e6ff;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
            min-width: 160px;
        }

        #hud b {
            color: #fff;
            font-weight: 500;
        }

        /* 暂停时中间飘一个状态提示 */
        #paused-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 26px;
            border-radius: 8px;
            background: rgba(255, 200, 61, 0.16);
            border: 1px solid rgba(255, 200, 61, 0.55);
            color: #ffc83d;
            font-size: 15px;
            letter-spacing: 4px;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #paused-badge.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="tip">点击小球 → 暂停 / 继续滚动 ｜ 拖动 → 环绕观察 ｜ 滚轮 → 缩放</div>
    <div id="paused-badge">已 暂 停</div>
    <div id="hud"></div>

    <!-- type="importmap"功能：.html文件中也能和nodejs开发环境中一样方式，引入npm安装的js库 -->
    <script type="importmap">
        {
			"imports": {
				"three": "../../three.js/build/three.module.js",
                "three/addons/": "../../three.js/examples/jsm/",
                "gsap": "../../libs/gsap/index.js"
			}
		}
	</script>
    <script src="./index.js" type="module">
    </script>
</body>

</html>
