<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>案例-全景公园 | Three.js 全景图</title>
    <style>
        body {
            overflow: hidden;
            margin: 0px;
            background: #000;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 顶部使用提示 */
        #tip {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
        }

        /* 左下角参数面板：实时显示相机视角参数 */
        #hud {
            position: absolute;
            left: 16px;
            bottom: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.45);
            color: #b8e6ff;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(6px);
            font-variant-numeric: tabular-nums;
        }

        #hud b {
            color: #fff;
            font-weight: 500;
        }

        /* 点击热点后的提示气泡 */
        #toast {
            position: absolute;
            right: 16px;
            bottom: 16px;
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(0, 120, 215, 0.75);
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transform: translateY(10px);
            transition: all .3s ease;
            pointer-events: none;
            user-select: none;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 景点文字标签（CSS2DObject 渲染） */
        .spot-label {
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(120, 210, 255, 0.7);
            color: #eaf7ff;
            font-size: 12px;
            white-space: nowrap;
            user-select: none;
        }
    </style>
</head>

<body>
    <div id="tip">按住鼠标左键拖动 → 环顾四周 ｜ 滚轮 → 变焦 ｜ 点击蓝色光点 → 前往景点</div>
    <div id="hud"></div>
    <div id="toast"></div>

    <!-- type="importmap"功能：.html文件中也能和nodejs开发环境中一样方式，引入npm安装的js库 -->
    <script type="importmap">
        {
			"imports": {
				"three": "../../three.js/build/three.module.js",
                "three/addons/": "../../three.js/examples/jsm/"
			}
		}
	</script>
    <script src="./index.js" type="module">
    </script>
</body>

</html>
