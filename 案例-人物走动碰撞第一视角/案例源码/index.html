<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>案例-人物走动碰撞第一视角 | FPS 视角 + 刚体碰撞</title>
    <style>
        body { overflow: hidden; margin: 0px; background: #0b0d12; font-family: "Microsoft YaHei", Arial, sans-serif; }
        #tip { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; letter-spacing: 1px; pointer-events: none; user-select: none; backdrop-filter: blur(6px); z-index: 5; }
        #hud { position: absolute; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.55); color: #b8e6ff; font-size: 12px; line-height: 1.7; pointer-events: none; user-select: none; backdrop-filter: blur(6px); z-index: 5; }
        #hud b { color: #fff; font-weight: 500; }
        #hud code { color: #ffd88a; font-family: Consolas, monospace; }
        #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.75); }
        #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
        #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
        #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8ab4f8; font-size: 15px; letter-spacing: 2px; background: #0b0d12; z-index: 10; transition: opacity .5s; }
    </style>
</head>

<body>
    <div id="loading">模型加载中……</div>
    <div id="crosshair"></div>
    <div id="tip">W 前 ｜ A 左 ｜ S 后 ｜ D 右（第一人称，眼睛视角）｜ 按住鼠标左键左右拖 → 转视角</div>
    <div id="hud"></div>
    <script type="importmap">
        { "imports": {
            "three": "../../three.js/build/three.module.js",
            "three/addons/": "../../three.js/examples/jsm/",
            "cannon-es": "../../libs/cannon-es.js"
        } }
    </script>
    <script src="./index.js" type="module"></script>
</body>

</html>
