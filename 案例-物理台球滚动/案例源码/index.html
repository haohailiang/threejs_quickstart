<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>案例-物理台球滚动 | CANNON 摩擦 + 自旋</title>
    <style>
        body { overflow: hidden; margin: 0px; background: #0b0d12; font-family: "Microsoft YaHei", Arial, sans-serif; }
        #tip { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; letter-spacing: 1px; pointer-events: none; user-select: none; backdrop-filter: blur(6px); }
        #hud { position: absolute; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.55); color: #b8e6ff; font-size: 12px; line-height: 1.7; pointer-events: none; user-select: none; backdrop-filter: blur(6px); }
        #hud b { color: #fff; font-weight: 500; }
        #hud code { color: #ffd88a; font-family: Consolas, monospace; }
    </style>
</head>

<body>
    <div id="tip">右侧面板 → 击球速度 / 上抛分量 / 自旋 / 摩擦 ｜ 看 HUD 的"滑移量"：归零就是纯滚动了</div>
    <div id="hud"></div>
    <script type="importmap">
        { "imports": {
            "three": "../../three.js/build/three.module.js",
            "three/addons/": "../../three.js/examples/jsm/",
            "cannon-es": "../../libs/cannon-es.js"
        } }
    </script>
    <script src="./index.js" type="module"></script>
</body>

</html>
